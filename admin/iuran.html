<main class="content">

<h1>💰 Iuran Warga</h1>

<form id="formIuran">

<input type="hidden" id="editId">

<label>Nama Warga</label>

<select id="warga" required>

<option value="">Pilih Warga</option>

</select>

<label>Bulan</label>

<select id="bulan" required>

<option>Januari</option>
<option>Februari</option>
<option>Maret</option>
<option>April</option>
<option>Mei</option>
<option>Juni</option>
<option>Juli</option>
<option>Agustus</option>
<option>September</option>
<option>Oktober</option>
<option>November</option>
<option>Desember</option>

</select>

<label>Tahun</label>

<input
type="number"
id="tahun"
value="2026"
required>

<label>Nominal</label>

<input
type="number"
id="nominal"
value="25000"
required>

<label>Status</label>

<select id="status">

<option>Lunas</option>

<option>Belum Lunas</option>

</select>

<button type="submit" id="btnSimpan">

Simpan Iuran

</button>

</form>

<br>

<input
type="text"
id="cari"
placeholder="🔍 Cari Warga">

<br><br>

<table>

<thead>

<tr>

<th>Nama</th>

<th>Bulan</th>

<th>Tahun</th>

<th>Nominal</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="listIuran">

</tbody>

</table>

</main>

</div>

<script type="module" src="../js/iuran.js"></script>
